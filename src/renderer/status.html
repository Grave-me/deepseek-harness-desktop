<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>DeepSeek Harness Desktop</title>
  <link rel="stylesheet" href="status.css">
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">D</div>
    <h1>DeepSeek Harness</h1>
    <p id="message">正在准备本地 Harness…</p>
    <p id="details" class="details">状态：初始化</p>
    <div class="actions">
      <button id="retry" type="button">重试 / 重启</button>
      <button id="logs" type="button">打开日志目录</button>
      <button id="quit" class="secondary" type="button">退出</button>
    </div>
  </main>
  <script src="status.js"></script>
</body>
</html>
